# ═══════════════════════════════════════════════════════════════
#   DevShield — CI/CD Pipeline
#   Trigger: main branch ga push
#   Steps:  Build → Push (GHCR) → Deploy (Oracle Cloud VPS)
# ═══════════════════════════════════════════════════════════════

name: 🚀 DevShield CI/CD

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devshield

permissions:
  contents: read
  packages: write

jobs:

  # ═══════════════════════════════════════════════════════════
  #   1-BOSQICH: Docker imagelarni build va GHCR ga push
  # ═══════════════════════════════════════════════════════════
  build-and-push:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: django
            context: .
            dockerfile: ./services/drf/Dockerfile
          - service: fastapi-worker
            context: .
            dockerfile: ./services/fastapi/Dockerfile
          - service: bot
            context: .
            dockerfile: ./services/bot/Dockerfile
          - service: nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false


  # ═══════════════════════════════════════════════════════════
  #   2-BOSQICH: Oracle Cloud VPS ga deploy
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📤 Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "~/devshield"

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "═══════════════════════════════════════════"
            echo "  🚀 DevShield Deploy boshlandi..."
            echo "  📅 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════════"

            cd ~/devshield

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Yangi imagelarni yuklab olish..."
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 Konteynerlarni yangilash..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🗄️ Migratsiyalar..."
            docker compose -f docker-compose.prod.yml exec -T django python services/drf/manage.py migrate --noinput

            echo "📦 Static fayllarni yig'ish..."
            docker compose -f docker-compose.prod.yml exec -T django python services/drf/manage.py collectstatic --noinput

            echo "🧹 Eski imagelarni tozalash..."
            docker image prune -f

            echo "🏥 Health check..."
            sleep 10

            if docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ Barcha konteynerlar ishlayapti!"
              docker compose -f docker-compose.prod.yml ps
            else
              echo "❌ Ba'zi konteynerlar ishga tushmadi!"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi

            echo "═══════════════════════════════════════════"
            echo "  ✅ Deploy muvaffaqiyatli yakunlandi!"
            echo "═══════════════════════════════════════════"