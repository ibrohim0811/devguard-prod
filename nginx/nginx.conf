# ═══════════════════════════════════════════════════════════════
#   DevShield — Nginx Reverse Proxy Configuration
#   Subdomain: ibrohim.api.devguard.uz
#   Backend:   Django (Daphne) — HTTP + WebSocket
# ═══════════════════════════════════════════════════════════════

upstream django_backend {
    server django:8000;

    # Keepalive ulanishlar — Django bilan qayta ulanishlarni kamaytirish
    keepalive 32;
}


# ─── Rate Limiting Zonalari ──────────────────────────────────
#
#   1) api_limit     — Umumiy API so'rovlar: 20 req/sec (normal foydalanish)
#   2) scan_limit    — Scan endpointlar: 2 req/min (og'ir operatsiyalar)
#   3) auth_limit    — Login/Register: 5 req/min (brute-force himoyasi)
#   4) burst_limit   — Global himoya: 50 req/sec (DDoS oldini olish)
#   5) ws_limit      — WebSocket ulanishlar: 5 req/sec
#
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=scan_limit:10m   rate=2r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=burst_limit:20m  rate=50r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:5m      rate=5r/s;

# ─── Ulanish limiti (bir IP dan max ulanish soni) ────────────
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


# ─── Yomon botlar va skanerlarni bloklash ─────────────────────
map $http_user_agent $bad_bot {
    default                 0;
    ~*(?:sqlmap)            1;
    ~*(?:nikto)             1;
    ~*(?:nmap)              1;
    ~*(?:masscan)           1;
    ~*(?:dirbuster)         1;
    ~*(?:gobuster)          1;
    ~*(?:wfuzz)             1;
    ~*(?:nuclei)            1;
    ~*(?:zgrab)             1;
    ~*(?:httpx)             1;
    ~*(?:python-requests)   1;
    ~*(?:go-http-client)    1;
    ~*(?:curl/)             1;
    ~*(?:wget/)             1;
    ~*(?:scrapy)            1;
    ~*(?:semrush)           1;
    ~*(?:ahref)             1;
    ~*(?:mj12bot)           1;
    ~*(?:dotbot)            1;
    ~*(?:petalbot)          1;
}


# ═══════════════════════════════════════════════════════════════
#   Server Block — HTTP (80-port)
#   Production uchun: 443-portga yo'naltirish kerak bo'ladi
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name ibrohim.api.devguard.uz;

    # ─── Umumiy sozlamalar ─────────────────────────────────────
    charset utf-8;
    client_max_body_size            20M;
    client_body_buffer_size         128k;
    client_header_buffer_size       4k;
    large_client_header_buffers     4 16k;

    # ─── Slow Loris va Timeout himoyasi ────────────────────────
    client_body_timeout             15s;
    client_header_timeout           15s;
    send_timeout                    30s;
    keepalive_timeout               65s;
    keepalive_requests              100;

    # ─── Ulanish limiti (bir IP dan max 100 ta ulanish) ────────
    limit_conn conn_limit 100;
    limit_conn_status 429;

    # ─── Rate limit xato statusi ───────────────────────────────
    limit_req_status 429;

    # ─── Gzip siqish ──────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.api+json
        image/svg+xml;

    # ─── Xavfsizlik Headerlari (barcha javoblar uchun) ─────────
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header X-Frame-Options          "DENY"                              always;
    add_header X-XSS-Protection         "1; mode=block"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none"                     always;
    add_header X-Download-Options       "noopen"                            always;
    add_header X-DNS-Prefetch-Control   "off"                               always;

    # Content-Security-Policy — API server uchun faqat kerakli manbalar
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://ibrohim.api.devguard.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Server versiyasini yashirish (nginx.conf main kontekstda ham server_tokens off qo'shish kerak)
    server_tokens off;

    # ─── Yomon botlarni bloklash ───────────────────────────────
    if ($bad_bot) {
        return 444;
    }

    # ─── Noma'lum HTTP metodlarni bloklash ─────────────────────
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 444;
    }

    # ─── Yashirin fayllarni bloklash (.git, .env, va boshqalar) ─
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ─── wp-admin, phpMyAdmin va boshqa skanerlash nishonlarini bloklash ─
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|administrator|xmlrpc\.php|\.well-known/security\.txt) {
        access_log off;
        log_not_found off;
        return 444;
    }


    # ═══════════════════════════════════════════════════════════
    #   Static & Media fayllar (Django bypass, volume dan)
    # ═══════════════════════════════════════════════════════════

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # Static fayllar uchun CORS kerak emas
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # Xavfsizlik: media fayllar orqali script bajartirmaslik
        location ~* \.(php|py|sh|pl|cgi|asp|jsp)$ {
            deny all;
            return 403;
        }
    }


    # ═══════════════════════════════════════════════════════════
    #   WebSocket (Django Channels)
    # ═══════════════════════════════════════════════════════════

    location /ws/ {
        limit_req zone=ws_limit burst=10 nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        # WebSocket upgrade headerlari
        proxy_set_header    Upgrade         $http_upgrade;
        proxy_set_header    Connection      "upgrade";

        # Real IP va host headerlari
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;

        # Scan 15 daqiqagacha davom etishi mumkin
        proxy_read_timeout      900s;
        proxy_send_timeout      900s;
        proxy_connect_timeout   10s;

        # WebSocket bufferlash
        proxy_buffering         off;
        proxy_cache             off;
    }


    # ═══════════════════════════════════════════════════════════
    #   Autentifikatsiya endpointlari (Brute-force himoyasi)
    # ═══════════════════════════════════════════════════════════

    location ~ ^/api/(auth|token|login|register|password)/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 10;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
    }


    # ═══════════════════════════════════════════════════════════
    #   Scan endpointlar (Og'ir operatsiyalar — qattiq rate limit)
    # ═══════════════════════════════════════════════════════════

    location ~ ^/api/(scan|fullscan)/ {
        limit_req zone=scan_limit burst=3 nodelay;
        limit_conn conn_limit 5;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        # Scan uzoq davom etishi mumkin
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_connect_timeout   10s;
    }


    # ═══════════════════════════════════════════════════════════
    #   Django Admin paneli
    # ═══════════════════════════════════════════════════════════

    location /admin/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }


    # ═══════════════════════════════════════════════════════════
    #   Swagger / API Docs
    # ═══════════════════════════════════════════════════════════

    location ~ ^/(api/schema|api/docs|api/redoc)/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    Connection          "";

        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
    }


    # ═══════════════════════════════════════════════════════════
    #   Umumiy API va boshqa barcha so'rovlar
    # ═══════════════════════════════════════════════════════════

    location / {
        # Ikkita qatlam: global burst + API limit
        limit_req zone=burst_limit burst=100 nodelay;
        limit_req zone=api_limit  burst=50  nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
        proxy_connect_timeout   10s;

        # Proxy bufferlash
        proxy_buffer_size       16k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
    }


    # ═══════════════════════════════════════════════════════════
    #   Maxsus xato sahifalari
    # ═══════════════════════════════════════════════════════════

    # Rate limit ishlaganda
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "So\\'rovlar soni limitdan oshdi. Iltimos, bir oz kuting.", "retry_after": 60}';
    }

    # Server xatosi
    error_page 502 503 504 = @server_error;
    location @server_error {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "message": "Server vaqtinchalik ishlamayapti. Iltimos, keyinroq urinib ko\\'ring."}';
    }
}


# ═══════════════════════════════════════════════════════════════
#   Default server — boshqa subdomain yoki IP orqali kelgan
#   so'rovlarni to'xtatish (Host headeri to'g'ri bo'lmasa)
# ═══════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;

    # Noto'g'ri host bilan kelganlarni darhol uzish
    return 444;
}
