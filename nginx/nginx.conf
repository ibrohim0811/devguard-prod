# ═══════════════════════════════════════════════════════════════
#   DevShield — Nginx Reverse Proxy Configuration (HTTPS)
#   Subdomain: ibrohim.api.devguard.uz
# ═══════════════════════════════════════════════════════════════

upstream django_backend {
    server django:8000;
    keepalive 32;
}

# ─── Rate Limiting Zonalari ──────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=scan_limit:10m   rate=2r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=burst_limit:20m  rate=50r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:5m      rate=5r/s;

limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Yomon botlar va skanerlarni bloklash ─────────────────────
map $http_user_agent $bad_bot {
    default                 0;
    ~*(?:sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wfuzz|nuclei|zgrab|httpx|python-requests|go-http-client|curl/|wget/|scrapy|semrush|ahref|mj12bot|dotbot|petalbot) 1;
}

# ═══════════════════════════════════════════════════════════════
#   HTTP (80-port) — HTTPS'ga yo'naltirish
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.devguard.uz ibrohim.api.devguard.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════
#   HTTPS (443-port) — ASOSIY SERVER BLOCK
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name api.devguard.uz ibrohim.api.devguard.uz;

    # SSL Sertifikat fayllari
    ssl_certificate         /etc/letsencrypt/live/api.devguard.uz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.devguard.uz/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;

    # ─── Umumiy Sozlamalar ─────────────────────────────────────
    charset utf-8;
    client_max_body_size            20M;
    client_body_buffer_size         128k;
    client_header_buffer_size       4k;
    large_client_header_buffers     4 16k;

    client_body_timeout             15s;
    client_header_timeout           15s;
    send_timeout                    30s;
    keepalive_timeout               65s;
    keepalive_requests              100;

    limit_conn conn_limit 100;
    limit_conn_status 429;
    limit_req_status 429;

    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.api+json
        image/svg+xml;

    # ─── Xavfsizlik Headerlari ─────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header X-Frame-Options          "DENY"                              always;
    add_header X-XSS-Protection         "1; mode=block"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none"                     always;
    add_header X-Download-Options       "noopen"                            always;
    add_header X-DNS-Prefetch-Control   "off"                               always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://api.devguard.uz wss://ibrohim.api.devguard.uz https://api.devguard.uz https://ibrohim.api.devguard.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;

    if ($bad_bot) {
        return 444;
    }

    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 444;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|administrator|xmlrpc\.php|\.well-known/security\.txt) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # ─── Static & Media ───────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        location ~* \.(php|py|sh|pl|cgi|asp|jsp)$ {
            deny all;
            return 403;
        }
    }

    # ─── WebSocket ────────────────────────────────────────────
    location /ws/ {
        limit_req zone=ws_limit burst=10 nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Upgrade         $http_upgrade;
        proxy_set_header    Connection      "upgrade";

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;

        proxy_read_timeout      900s;
        proxy_send_timeout      900s;
        proxy_connect_timeout   10s;

        proxy_buffering         off;
        proxy_cache             off;
    }

    # ─── Auth Endpoints ───────────────────────────────────────
    location ~ ^/api/(auth|token|login|register|password)/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 10;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
    }

    # ─── Scan Endpoints ───────────────────────────────────────
    location ~ ^/api/(scan|fullscan)/ {
        limit_req zone=scan_limit burst=3 nodelay;
        limit_conn conn_limit 5;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_connect_timeout   10s;
    }

    # ─── Admin ────────────────────────────────────────────────
    location /admin/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }

    # ─── Swagger ──────────────────────────────────────────────
    location ~ ^/(spectacular|api/schema|api/docs|api/redoc)/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    Connection          "";

        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
    }

    # ─── General API ──────────────────────────────────────────
    location / {
        limit_req zone=burst_limit burst=100 nodelay;
        limit_req zone=api_limit  burst=50  nodelay;

        proxy_pass          http://django_backend;
        proxy_http_version  1.1;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Request-ID        $request_id;
        proxy_set_header    Connection          "";

        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
        proxy_connect_timeout   10s;

        proxy_buffer_size       16k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
    }

    # ─── Errors ───────────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "So\\'rovlar soni limitdan oshdi. Iltimos, bir oz kuting.", "retry_after": 60}';
    }

    error_page 502 503 504 = @server_error;
    location @server_error {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "message": "Server vaqtinchalik ishlamayapti. Iltimos, keyinroq urinib ko\\'ring."}';
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}