upstream django_backend {
    server django:8000;
}

# ─── Rate Limiting ──────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=2r/m;

server {
    listen 80;
    server_name _;

    # Max upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ─── Security Headers ──────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"           always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ─── Static Files (Django bypass, volume dan) ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ─── WebSocket (Django Channels) ───────────────
    location /ws/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scan 15 daqiqagacha davom etishi mumkin
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_connect_timeout 10s;
    }

    # ─── Scan endpoints (rate limited) ─────────────
    location ~ ^/api/(scan|fullscan)/ {
        limit_req zone=scan_limit burst=3 nodelay;
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── Django API & Admin ─────────────────────────
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
