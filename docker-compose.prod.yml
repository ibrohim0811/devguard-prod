# ═══════════════════════════════════════════════════════════════
#   DevShield — Production Docker Compose
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────
  #   Infrastructure
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devshield_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devshield_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: devshield_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - devshield_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devshield_rabbitmq
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${PIKA_USER}
      RABBITMQ_DEFAULT_PASS: ${PIKA_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - devshield_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  #   Application
  # ─────────────────────────────────────────

  # HTTP requests are served by WSGI/Gunicorn.
  django:
    image: ghcr.io/ibrohim0811/devshield-django:latest
    container_name: devshield_django
    # The entrypoint applies migrations, collects static files, then starts Gunicorn.
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devshield_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # A separate ASGI process guarantees that /ws/ never reaches Gunicorn.
  django_asgi:
    image: ghcr.io/ibrohim0811/devshield-django:latest
    container_name: devshield_django_asgi
    command: daphne -b 0.0.0.0 -p 8000 devshield.asgi:application
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devshield_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  celery:
    image: ghcr.io/ibrohim0811/devshield-django:latest
    container_name: devshield_celery
    command: celery -A devshield worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devshield_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  fastapi_worker:
    image: ghcr.io/ibrohim0811/devshield-fastapi-worker:latest
    container_name: devshield_fastapi_worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devshield_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    image: ghcr.io/ibrohim0811/devshield-bot:latest
    container_name: devshield_bot
    environment:
      - DJANGO_SETTINGS_MODULE=devshield.settings
      - PYTHONPATH=/app/services/drf
    env_file: .env
    depends_on:
      django:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - devshield_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────────────────────────────────
  #   Nginx
  # ─────────────────────────────────────────
  nginx:
    image: ghcr.io/ibrohim0811/devshield-nginx:latest
    container_name: devshield_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - django
      - django_asgi
    networks:
      - devshield_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  static_files:
  media_files:

networks:
  devshield_network:
    driver: bridge
